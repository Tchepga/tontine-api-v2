# Mots de passe : valeurs par défaut pour le dev local ; en prod, surcharger dans .env (non versionné).
services:
  mysql:
    image: mysql:8.0
    container_name: tontine-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tontine}
      MYSQL_USER: ${MYSQL_USER:-tontine}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tontine}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Évite les verrous de socket obsolètes après crash / docker restart (même conteneur).
    # Sans tmpfs, /var/run/mysqld persiste et MySQL peut boucler sur "Invalid pid in unix socket lock file".
    tmpfs:
      - /var/run/mysqld
    healthcheck:
      # $$ → $ dans le conteneur ; MYSQL_ROOT_PASSWORD est injecté par l’image
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer:latest
    container_name: tontine-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  mysql_data:
