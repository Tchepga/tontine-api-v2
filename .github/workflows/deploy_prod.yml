name: Deploy to Production

# SSH deploy credentials are read from Repository secrets (Settings → Secrets → Actions):
#   HOST_VPS_HOSTINGER  → IP ou domaine du serveur
#   HOST_VPS_USER       → utilisateur SSH (ex: root ou ubuntu)
#   SSH_KEY_VPS_HOSTINGER → clé privée SSH complète (BEGIN/END inclus)

# Deploy only runs when master moves (direct push or merge of a PR into master).
on:
  push:
    branches:
      - master

jobs:
  test:
    name: Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:prod

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify deploy secrets are set
        env:
          HOST_VPS_HOSTINGER: ${{ secrets.HOST_VPS_HOSTINGER }}
          HOST_VPS_USER: ${{ secrets.HOST_VPS_USER }}
          SSH_KEY_VPS_HOSTINGER: ${{ secrets.SSH_KEY_VPS_HOSTINGER }}
        run: |
          ok=0
          [ -n "$HOST_VPS_HOSTINGER" ] || { echo "::error::HOST_VPS_HOSTINGER is missing or empty."; ok=1; }
          [ -n "$HOST_VPS_USER" ] || { echo "::error::HOST_VPS_USER is missing or empty."; ok=1; }
          [ -n "$SSH_KEY_VPS_HOSTINGER" ] || { echo "::error::SSH_KEY_VPS_HOSTINGER is missing or empty (full private key with BEGIN/END lines required)."; ok=1; }
          exit $ok

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:prod

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_VPS_HOSTINGER }}
          username: ${{ secrets.HOST_VPS_USER }}
          key: ${{ secrets.SSH_KEY_VPS_HOSTINGER }}
          # dist/ + manifests npm : nécessaires pour installer dotenv et deps runtime
          source: 'dist,package.json,package-lock.json'
          target: '/root/apps/tontine'
          # Connexion VPS parfois lente depuis les runners GitHub
          timeout: 120s
          command_timeout: 20m
          overwrite: true

      # Déploiement sans coupure : l'API tourne en 2 instances systemd
      # (tontine-api@8081 et tontine-api@8082) derrière Caddy (failover,
      # health check sur /api/health). On redémarre les instances une par
      # une : Caddy route vers l'instance saine pendant le restart.
      - name: Run server command via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST_VPS_HOSTINGER }}
          username: ${{ secrets.HOST_VPS_USER }}
          key: ${{ secrets.SSH_KEY_VPS_HOSTINGER }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            APP_DIR=~/apps/tontine
            ENV_SRC=~/config/.env-tontine-api

            # SSH non-interactif : Volta n'est pas dans le PATH par défaut
            export VOLTA_HOME="${VOLTA_HOME:-$HOME/.volta}"
            export PATH="$VOLTA_HOME/bin:/usr/local/bin:/usr/bin:$PATH"
            command -v npm >/dev/null 2>&1 || { echo "npm not found. PATH=$PATH"; exit 1; }
            command -v node >/dev/null 2>&1 || { echo "node not found"; exit 1; }
            echo "Using $(command -v node) ($(node -v)) / $(command -v npm) ($(npm -v))"

            test -f "$ENV_SRC" || { echo "Missing $ENV_SRC"; exit 1; }
            grep -q '^JWT_SECRET=.\+' "$ENV_SRC" || { echo "JWT_SECRET missing or empty in $ENV_SRC"; exit 1; }
            grep -q '^NODE_ENV=production' "$ENV_SRC" || { echo "NODE_ENV=production required in $ENV_SRC"; exit 1; }
            grep -q '^DB_SYNCHRONIZE=false' "$ENV_SRC" || { echo "DB_SYNCHRONIZE=false required in $ENV_SRC (use migrations)"; exit 1; }

            cp "$ENV_SRC" "$APP_DIR/.env"
            cd "$APP_DIR"

            npm ci --omit=dev

            echo "Running database migrations..."
            NODE_ENV=production npm run migration:run:prod

            # Rolling restart : 8082 (secours) d'abord, puis 8081 (primaire).
            # Pendant le restart de 8081, Caddy bascule le trafic sur 8082.
            for PORT in 8082 8081; do
              echo "Restarting tontine-api@$PORT..."
              systemctl restart "tontine-api@$PORT"

              healthy=0
              for i in $(seq 1 30); do
                if curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
                  healthy=1
                  echo "Instance $PORT healthy after ${i}s"
                  break
                fi
                sleep 1
              done

              if [ "$healthy" != 1 ]; then
                echo "Instance $PORT FAILED to become healthy. Recent logs:"
                tail -n 50 "$APP_DIR/logs/app-$PORT.log" || true
                systemctl status "tontine-api@$PORT" --no-pager || true
                exit 1
              fi
            done

            echo "Deploy OK:"
            systemctl is-active tontine-api@8081 tontine-api@8082
            curl -fsS -o /dev/null -w "public health: %{http_code}\n" https://api.tontine.devcoorp.net/api/health
