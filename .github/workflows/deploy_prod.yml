name: Deploy to Production

# SSH deploy credentials are read from Repository secrets (Settings → Secrets → Actions):
#   HOST_VPS_HOSTINGER  → IP ou domaine du serveur
#   HOST_VPS_USER       → utilisateur SSH (ex: root ou ubuntu)
#   SSH_KEY_VPS_HOSTINGER → clé privée SSH complète (BEGIN/END inclus)

# Deploy only runs when master moves (direct push or merge of a PR into master).
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify deploy secrets are set
        env:
          HOST_VPS_HOSTINGER: ${{ secrets.HOST_VPS_HOSTINGER }}
          HOST_VPS_USER: ${{ secrets.HOST_VPS_USER }}
          SSH_KEY_VPS_HOSTINGER: ${{ secrets.SSH_KEY_VPS_HOSTINGER }}
        run: |
          ok=0
          [ -n "$HOST_VPS_HOSTINGER" ] || { echo "::error::HOST_VPS_HOSTINGER is missing or empty."; ok=1; }
          [ -n "$HOST_VPS_USER" ] || { echo "::error::HOST_VPS_USER is missing or empty."; ok=1; }
          [ -n "$SSH_KEY_VPS_HOSTINGER" ] || { echo "::error::SSH_KEY_VPS_HOSTINGER is missing or empty (full private key with BEGIN/END lines required)."; ok=1; }
          exit $ok

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:prod

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_VPS_HOSTINGER }}
          username: ${{ secrets.HOST_VPS_USER }}
          key: ${{ secrets.SSH_KEY_VPS_HOSTINGER }}
          # dist/ + manifests npm : nécessaires pour installer dotenv et deps runtime
          source: 'dist,package.json,package-lock.json'
          target: '/root/apps/tontine'
          # Connexion VPS parfois lente depuis les runners GitHub
          timeout: 120s
          command_timeout: 20m
          overwrite: true

      - name: Run server command via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST_VPS_HOSTINGER }}
          username: ${{ secrets.HOST_VPS_USER }}
          key: ${{ secrets.SSH_KEY_VPS_HOSTINGER }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            APP_DIR=~/apps/tontine
            ENV_SRC=~/config/.env-tontine-api
            PID_FILE="$APP_DIR/app.pid"

            # SSH non-interactif : Volta n'est pas dans le PATH par défaut
            export VOLTA_HOME="${VOLTA_HOME:-$HOME/.volta}"
            export PATH="$VOLTA_HOME/bin:/usr/local/bin:/usr/bin:$PATH"
            command -v npm >/dev/null 2>&1 || { echo "npm not found. PATH=$PATH"; ls -la "$VOLTA_HOME/bin" 2>/dev/null || true; exit 1; }
            command -v node >/dev/null 2>&1 || { echo "node not found"; exit 1; }
            echo "Using $(command -v node) ($(node -v)) / $(command -v npm) ($(npm -v))"

            test -f "$ENV_SRC" || { echo "Missing $ENV_SRC"; exit 1; }
            grep -q '^JWT_SECRET=.\+' "$ENV_SRC" || { echo "JWT_SECRET missing or empty in $ENV_SRC"; exit 1; }
            grep -q '^NODE_ENV=production' "$ENV_SRC" || { echo "NODE_ENV=production required in $ENV_SRC"; exit 1; }

            cp "$ENV_SRC" "$APP_DIR/.env"
            cd "$APP_DIR"

            npm ci --omit=dev

            # Lire le port depuis .env (défaut 8081)
            APP_PORT=$(grep -E '^PORT=' "$APP_DIR/.env" | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
            APP_PORT=${APP_PORT:-8081}

            stop_on_port() {
              local port="$1"
              local pids
              pids=$(ss -tlnp "sport = :$port" 2>/dev/null | sed -n 's/.*pid=\([0-9]\+\).*/\1/p' | sort -u)
              if [ -z "$pids" ] && command -v fuser >/dev/null 2>&1; then
                pids=$(fuser "${port}/tcp" 2>/dev/null || true)
              fi
              if [ -n "$pids" ]; then
                echo "Stopping PIDs on port $port: $pids"
                # shellcheck disable=SC2086
                kill $pids 2>/dev/null || true
                sleep 2
                # shellcheck disable=SC2086
                kill -9 $pids 2>/dev/null || true
              fi
            }

            echo "Stopping previous tontine API instance(s)..."
            if [ -f "$PID_FILE" ]; then
              OLD_PID=$(cat "$PID_FILE" || true)
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" || true
                sleep 1
                kill -9 "$OLD_PID" 2>/dev/null || true
              fi
              rm -f "$PID_FILE"
            fi

            # Couvre cmdline relative (node dist/main.js) et absolue
            pkill -f "$APP_DIR/dist/main.js" 2>/dev/null || true
            pkill -f "node dist/main.js" 2>/dev/null || true
            stop_on_port "$APP_PORT"
            # Ancien process parfois resté sur 8080 après un démarrage partiel
            stop_on_port 8080
            sleep 1

            if ss -tln | grep -qE ":${APP_PORT}\\b"; then
              echo "Port $APP_PORT still in use after stop attempts:"
              ss -tlnp | grep -E ":${APP_PORT}\\b" || true
              exit 1
            fi

            # dotenv charge .env au boot ; NODE_ENV exporté en plus pour le shell
            export NODE_ENV=production
            nohup node dist/main.js > "$APP_DIR/app.log" 2>&1 &
            echo $! > "$PID_FILE"

            sleep 3
            if ! kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
              echo "Process failed to start. Last log lines:"
              tail -n 50 "$APP_DIR/app.log" || true
              exit 1
            fi
            if ! ss -tln | grep -qE ":${APP_PORT}\\b"; then
              echo "Process alive but port $APP_PORT not listening. Last log lines:"
              tail -n 50 "$APP_DIR/app.log" || true
              exit 1
            fi
            echo "Deployed PID=$(cat "$PID_FILE") on port $APP_PORT"
